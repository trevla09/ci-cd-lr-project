name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get joke from Chuck Norris API
        id: joke
        run: |
          JOKE=$(curl -s https://api.chucknorris.io/jokes/random | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "joke=$JOKE" >> $GITHUB_ENV

      - name: Set version
        run: echo "VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $VERSION
          git push origin $VERSION

      - name: Create GitHub Release
        run: |
          gh release create $VERSION \
            --title "Release $VERSION" \
            --notes "## Release $VERSION
          - PR: ${{ github.event.pull_request.title }}
          - Chuck Norris: $joke"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README
        run: |
          cat >> README.md << EOF

          ## Latest Release Info
          - Version: $VERSION
          - PR Title: ${{ github.event.pull_request.title }}
          - Chuck Norris Joke: $joke
          EOF
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "docs: update README with release info $VERSION [skip ci]"
          git push origin main

      - name: Add joke comment to PR
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "🤠 Chuck Norris says: $joke"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
